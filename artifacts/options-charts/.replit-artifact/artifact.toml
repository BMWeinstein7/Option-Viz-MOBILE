kind = "data-app"
previewPath = "/options-charts/"
title = "Options Charts"
version = "1.0.0"
id = "artifacts/options-charts"
router = "path"

[[services]]
name = "web"
paths = [ "/options-charts/" ]
localPort = 24542

[services.development]
run = "pnpm --filter @workspace/options-charts run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/options-charts", "run", "build" ]
serve = "static"
publicDir = "artifacts/options-charts/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24542"
BASE_PATH = "/options-charts/"
